<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 3D Spherical Orb Base Gradient -->
    <radialGradient id="orbBody" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d0b5e"/>
      <stop offset="30%" stop-color="#170630"/>
      <stop offset="65%" stop-color="#0a0216"/>
      <stop offset="100%" stop-color="#020005"/>
    </radialGradient>

    <!-- Orb Luminous Border / Atmospheric Rim -->
    <linearGradient id="orbRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#6b21a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Inner Core Cosmic Bloom -->
    <radialGradient id="orbCoreGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#581c87" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassy Top Sheen -->
    <linearGradient id="glassSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Infinity Ribbon Gradient (Black -> Deep Purple -> Neon Violet -> Lavender) -->
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="18%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="64%" stop-color="#3b0764"/>
      <stop offset="80%" stop-color="#090214"/>
      <stop offset="90%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- 3D Over-Crossing Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadow for Over-Crossing Strand -->
    <filter id="bridgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- ================= CIRCLE ORB BACKGROUND ================= -->
  
  <!-- Outer Orb Circular Body with Atmospheric Edge -->
  <circle cx="64" cy="64" r="60" fill="url(#orbBody)" stroke="url(#orbRim)" stroke-width="2.5"/>

  <!-- Spherical Glass Highlight / Specular Cap -->
  <ellipse cx="64" cy="28" rx="42" ry="18" fill="url(#glassSheen)"/>

  <!-- Ambient Internal Nebula Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#orbCoreGlow)"/>

  <!-- ================= INFINITY SYMBOL ================= -->

  <!-- Outer Deep Contrast Base Shadow -->
  <path d="M 64 64 C 75 48, 86 42, 96 42 C 108 42, 115 52, 115 64 C 115 76, 108 86, 96 86 C 85 86, 75 80, 64 64 C 53 48, 43 42, 32 42 C 20 42, 13 52, 13 64 C 13 76, 20 86, 32 86 C 43 86, 53 80, 64 64 Z"
        fill="none"
        stroke="#000000"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.55"/>

  <!-- Continuous Infinity Ribbon -->
  <path d="M 64 64 C 75 48, 86 42, 96 42 C 108 42, 115 52, 115 64 C 115 76, 108 86, 96 86 C 85 86, 75 80, 64 64 C 53 48, 43 42, 32 42 C 20 42, 13 52, 13 64 C 13 76, 20 86, 32 86 C 43 86, 53 80, 64 64 Z"
        fill="none"
        stroke="url(#infinityGrad)"
        stroke-width="13.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 3D Over-Crossing Bridge (Strand passing over the center) -->
  <!-- Underlying Shadow Cutout -->
  <path d="M 50 75 C 56 70, 60 66, 64 64 C 68 62, 72 58, 78 53"
        fill="none"
        stroke="#000000"
        stroke-width="16"
        stroke-linecap="round"
        opacity="0.8"/>
  <!-- Front Bridge Strand -->
  <path d="M 50 75 C 56 70, 60 66, 64 64 C 68 62, 72 58, 78 53"
        fill="none"
        stroke="url(#bridgeGrad)"
        stroke-width="13.5"
        stroke-linecap="round"
        filter="url(#bridgeShadow)"/>

  <!-- Specular Rim Gloss Highlights on Top Arcs -->
  <path d="M 64 64 C 75 48, 86 42, 96 42 C 104 42, 110 47, 112 56"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity="0.85"/>
  <path d="M 64 64 C 53 48, 43 42, 32 42 C 24 42, 18 47, 16 56"
        fill="none"
        stroke="#f3e8ff"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity="0.65"/>

  <!-- Center Shimmer Node / Singularity Sparkle -->
  <circle cx="64" cy="64" r="2.2" fill="#ffffff" opacity="0.95"/>
</svg>
